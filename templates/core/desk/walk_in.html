{% extends "base.html" %}
{% block title %}Walk-in Checkout — Eeshto{% endblock %}

{% block content %}
<div class="animate-slide-up space-y-8 max-w-2xl mx-auto">
  <div class="flex items-center gap-3">
    <a href="{% url 'core:member_desk' %}" class="text-surface-500 hover:text-surface-800 transition-colors">← Desk</a>
    <h1 class="text-3xl font-bold text-surface-900">Walk-in Checkout</h1>
  </div>

  <form method="post" class="glass rounded-2xl p-6 space-y-6">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-surface-700 mb-2">Borrower Email</label>
      <input type="email" name="borrower_email" required placeholder="user@ashoka.edu.in"
             class="w-full px-4 py-3 rounded-xl bg-surface-50 border border-surface-300 text-surface-800 placeholder-surface-400 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-all">
    </div>

    <div>
      <label class="block text-sm font-medium text-surface-700 mb-2">Borrower Contact Number (Required)</label>
      <input type="text" name="phone_number" required placeholder="e.g. 9876543210"
             class="w-full px-4 py-3 rounded-xl bg-surface-50 border border-surface-300 text-surface-800 placeholder-surface-400 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-all">
    </div>

    <div>
      <label class="block text-sm font-medium text-surface-700 mb-2">Available Copy</label>
      <select name="copy_id" required class="w-full px-4 py-3 rounded-xl bg-surface-50 border border-surface-300 text-surface-800 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-all">
        {% for copy in available_copies %}
          <option value="{{ copy.pk }}">{{ copy.game_title.name }} [{{ copy.copy_label }}] — {{ copy.get_condition_display }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-surface-700 mb-2">Condition Notes</label>
      <textarea name="condition_notes" rows="3" placeholder="Any notes about the game condition..."
                class="w-full px-4 py-3 rounded-xl bg-surface-50 border border-surface-300 text-surface-800 placeholder-surface-400 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-all resize-none"></textarea>
    </div>

    <button type="submit" class="w-full px-6 py-3.5 rounded-xl text-base font-semibold btn-primary text-white transition-all">
      Create Walk-in Checkout
    </button>
  </form>
</div>
{% endblock %}
